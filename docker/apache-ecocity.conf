# EcoCity no container: .htaccess ativos, sem listagem de pastas e sem expor
# os arquivos do projeto que não fazem parte do site (documentação, Docker, SQL).
ServerTokens Prod
ServerSignature Off
TraceEnable Off
LimitRequestBody 8388608

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
    SetEnv ECOCITY_APACHE_HEADERS 1

    # Endereço oficial: ecocity.devlucasleal.com.br (18/11/2026). O endereço antigo
    # (raiz e www) leva ao novo com o mesmo caminho e os mesmos parâmetros, para os
    # links e QR Codes já distribuídos continuarem funcionando. localhost não muda.
    RewriteEngine On
    RewriteCond %{HTTP_HOST} ^(www\.)?devlucasleal\.com\.br$ [NC]
    RewriteRule ^ https://ecocity.devlucasleal.com.br%{REQUEST_URI} [R=301,L]
</Directory>

<Directory /var/www/html/uploads>
    Require all denied
    php_admin_flag engine off
    SetHandler none
</Directory>

<LocationMatch "(?i)^/(docker|specs|referencia - site|referencia|apresentacao|database|config|includes|lib|uploads)(/|$)">
    Require all denied
</LocationMatch>

# Pastas e arquivos ocultos (ex.: .git, .env, .htaccess) nunca podem ser servidos.
<LocationMatch "(?i)(^|/)\.">
    Require all denied
</LocationMatch>

<FilesMatch "(?i)(^\.|\.(md|sql|py|yml|yaml|env|ini|log|ps1|sh|bat|bak|old|tmp|swp|example)$)">
    Require all denied
</FilesMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Frame-Options "DENY"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
Header always set Cross-Origin-Opener-Policy "same-origin"

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml
</IfModule>

<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresByType text/css "access plus 7 days"
    ExpiresByType application/javascript "access plus 7 days"
    ExpiresByType image/png "access plus 30 days"
    ExpiresByType image/jpeg "access plus 30 days"
    ExpiresByType image/webp "access plus 30 days"
    ExpiresByType image/svg+xml "access plus 30 days"
    ExpiresByType audio/ogg "access plus 30 days"
    ExpiresByType audio/mpeg "access plus 30 days"
    ExpiresByType font/woff2 "access plus 30 days"
</IfModule>
